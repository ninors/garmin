name: Garmin Data Sync

on:
  schedule:
    # Exécution automatique toutes les 6 heures (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Permet également de lancer le workflow manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    # Autorise le workflow à pousser les modifications sur le dépôt
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect garth

      - name: Exécuter le script de récupération Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python fetch_garmin.py
        - name: Commiter et Pousser les modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # S'assure que les dossiers existent pour éviter les erreurs Git
          mkdir -p gpx courses
          
          # Ajoute les fichiers générés (silencieusement si certains sont absents)
          git add data.json courses_index.json gpx/ courses/ 2>/dev/null || true
          
          # Commit seulement s'il y a des changements
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: Données Garmin" && git push)

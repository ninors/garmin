name: Garmin Sync & Export

on:
  workflow_dispatch: # Permet de lancer la synchro manuellement depuis GitHub ou via bouton web
  schedule:
    - cron: '0 4 * * 0' # Synchro automatique tous les dimanches à 04h00 UTC
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Synchronisation avec Garmin Connect
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          python fetch_garmin.py

      - name: 🚀 Sauvegarde des fichiers GPX/FIT et mise à jour du site web
        run: |
          git config --global user.name "Garmin Sync Bot"
          git config --global user.email "bot@github-actions.com"
          git add data/ .garminconnect/ || true
          git status
          git diff --staged --quiet || (git commit -m "Auto-sync Garmin GPX/FIT [$(date -u +'%Y-%m-%d %H:%M')]" && git push)
